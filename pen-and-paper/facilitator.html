<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trophy Heist Facilitator Guide</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>
@page{size:A4;margin:11mm}
:root{--ink:#161616;--pink:#ff6b9a;--yellow:#ffe45c;--green:#8dff9e;--blue:#9fe7ff;--mute:#555;--display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--mono:"Space Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#e9e4f3;color:var(--ink);font:12.5pt/1.4 var(--body)}
.toolbar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font:600 14px var(--body)}
.toolbar button,.toolbar a{font:700 13px var(--mono);background:var(--yellow);color:var(--ink);border:2px solid #fff;padding:6px 12px;cursor:pointer;text-decoration:none}
.page{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:11mm;position:relative;box-shadow:0 2px 12px #0003;break-after:page;page-break-after:always;overflow:hidden}
.page:last-child{break-after:auto;page-break-after:auto}
@media print{body{background:#fff}.toolbar,.noprint{display:none!important}.page{margin:0;box-shadow:none;width:auto;min-height:0;height:274mm;padding:0}}
h1{font:800 30pt/1.05 var(--display);margin:0 0 6px;letter-spacing:-.02em}
h2{font:800 19pt/1.15 var(--display);margin:0 0 6px;letter-spacing:-.01em}
h3{font:800 14pt/1.2 var(--display);margin:0 0 4px}
p{margin:0 0 8px}
.tag{display:inline-block;font:700 9pt var(--mono);letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--ink);padding:1px 8px;background:var(--yellow)}
.tag.red{background:#ffb3bd}.tag.green{background:var(--green)}.tag.blue{background:var(--blue)}
.box{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;margin:10px 4px 12px 0;background:#fff}
.box.y{background:#fff8c9}.box.p{background:#ffe3ee}.box.g{background:#e1ffe7}.box.b{background:#e0f7ff}
.band{margin:-10px -12px 8px;padding:5px 12px;border-bottom:3px solid var(--ink);font:700 9.5pt var(--mono);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.mono{font-family:var(--mono)}
table{border-collapse:collapse;width:100%;font-size:11pt}
th,td{border:2px solid var(--ink);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--yellow)}
ul,ol{margin:0 0 8px;padding-left:1.25em}li{margin:2px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.draw{border:3px dashed var(--ink);flex:1;min-height:60mm;background:#fff}
.char{height:128mm;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;margin-bottom:10mm;background:#fff}
.char .hd{padding:6px 10px;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.char .hd b{font:800 17pt var(--display)}
.spec{display:flex;gap:6px;padding:6px 10px;border-bottom:3px solid var(--ink);flex-wrap:wrap}
.spec span{font:700 10pt var(--mono);border:2px solid var(--ink);padding:1px 8px;background:#fff8c9}
.char .bd{padding:8px 10px;display:flex;flex-direction:column;flex:1;gap:6px}
.char .ft{padding:6px 10px;border-top:3px solid var(--ink);font:400 10pt var(--mono)}
.line{border-bottom:2px solid var(--ink);display:inline-block;min-width:60mm}
.lbox{display:inline-block;width:11mm;height:13mm;border:3px solid var(--ink);margin-right:4px;vertical-align:middle}
.opt{display:inline-block;border:2px solid var(--ink);padding:1px 8px;margin:3px 4px 3px 0;font:600 10.5pt var(--mono);background:#fff}
.opt i{font-style:normal;display:inline-block;background:var(--yellow);border-left:2px solid var(--ink);margin:-1px -8px -1px 8px;padding:1px 7px;font-weight:700}
.cert{height:128mm;border:6px double var(--ink);padding:14mm 12mm;text-align:center;margin-bottom:10mm;background:#fffdf0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.cert h1{font-size:26pt}
.token{border:3px dashed var(--ink);padding:6px 10px;text-align:center;font:700 10pt var(--mono);background:#fff8c9}
.fb-hide{font-size:10.5pt}
svg{display:block}
.lock{max-width:480px;margin:40px auto;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:20px}
.lock input{font:600 16px var(--body);padding:10px;border:2px solid var(--ink);width:100%;margin:8px 0}
.lock button{font:700 14px var(--mono);background:var(--yellow);border:2px solid var(--ink);padding:8px 16px;cursor:pointer}
